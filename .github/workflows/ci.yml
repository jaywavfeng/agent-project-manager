name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run contract and runtime tests
        run: python -m unittest discover -s tests -v
      - name: Check command interfaces
        run: |
          python scripts/statectl.py --help
          python scripts/statectl.py context --help
          python scripts/statectl.py bind-thread --help
          python scripts/statectl.py status-refresh --help
          python scripts/statectl.py memory-add --help
          python scripts/statectl.py memory-consolidate --help
          python scripts/benchmark.py --help
          python scripts/benchmark.py overhead --help
          python scripts/statectl.py control-worker --help
          python scripts/statectl.py cancel-review --help
          python scripts/statectl.py prepare-message --help
          python scripts/statectl.py record-message --help
          python scripts/statectl.py housekeep --help
          python scripts/statectl.py workspace-register --help
          python scripts/statectl.py workspace-restore --help
